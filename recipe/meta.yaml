{% set version = "3.1-171" %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-nlme
  version: {{ version|replace('-', '_') }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/nlme_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/nlme/nlme_{{ version }}.tar.gz
  sha256: 481dc8277dd0e0f2717ffb36edfb08141621470de173894fb1153464383ba0d3

build:
  number: 0
  rpaths:
    - lib/R/lib/
    - lib/
  missing_dso_whitelist:
    - '*/R.dll'        # [win]
    - '*/Rblas.dll'    # [win]
    - '*/Rlapack.dll'  # [win]

requirements:
  build:
    - cross-r-base {{ r_base }}        # [build_platform != target_platform]
    - r-lattice                        # [build_platform != target_platform]
    - {{ compiler('c') }}              # [not win]
    - {{ stdlib("c") }}                # [not win]
    - {{ compiler('m2w64_c') }}        # [win]
    - {{ stdlib("m2w64_c") }}          # [win]
    - {{ compiler('fortran') }}        # [not win]
    - {{ compiler('m2w64_fortran') }}  # [win]
    - {{ posix }}filesystem            # [win]
    - {{ posix }}make
    - {{ posix }}sed                   # [win]
    - {{ posix }}coreutils             # [win]
    - {{ posix }}zip                   # [win]
  host:
    - r-base
    - r-lattice
  run:
    - r-base
    - r-lattice

test:
  commands:
    - $R -e "library('nlme')"           # [not win]
    - "\"%R%\" -e \"library('nlme')\""  # [win]

about:
  home: https://svn.r-project.org/R-packages/trunk/nlme
  dev_url: https://github.com/cran/nlme
  license: GPL-2.0-or-later
  summary: Fit and compare Gaussian linear and nonlinear mixed-effects models.
  license_family: GPL3
  license_file:
    - {{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-2
    - {{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-3

extra:
  recipe-maintainers:
    - conda-forge/r
